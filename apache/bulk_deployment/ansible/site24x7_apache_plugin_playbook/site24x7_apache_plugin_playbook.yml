---
 - name: "Site24x7 apache Plugin Installation"
   hosts: all 
   become: yes
   vars:
      apache_url: "http://localhost:80/server-status?auto"
      apache_username: "None"                           
      apache_password: "None"    
      apache_access_logs_enabled: "true"
      apache_access_logs_file_path: "/var/log/apache*/access.log*"

  
   tasks:    
  # Site24x7 apache Prerequisites Check

   - name: "Python3 Installation Check."
     command: "python3 --version"
     register: python_version_output
     ignore_errors: yes

   - name: "Installing Python if not found (for Debian/Ubuntu)."
     apt:
        name: python3
        state: present
     when: "not python_version_output.stdout and ansible_facts['os_family'] == 'Debian'"

   - name: "Installing Python if not found (for CentOS/RedHat)."
     yum:
        name: python3
        state: present
     when: "not python_version_output.stdout and ansible_facts['os_family'] == 'RedHat'"

   - name: "pip3 Installation Check."
     command: "pip3 --version"
     register: pip_version_output
     ignore_errors: yes

   - name: "Installing pip3 if not found (for Debian/Ubuntu)."
     apt:
        name: python3-pip
        state: present
     when: "not pip_version_output.stdout and ansible_facts['os_family'] == 'Debian'"

   - name: "Installing pip3 if not found (for RedHat/CentOS)."
     yum:
        name: python3-pip
        state: present
     when: "not pip_version_output.stdout and ansible_facts['os_family'] == 'RedHat'"

   - name: "Site24x7 Agent Directory Check."
     stat:
      path: "/opt/site24x7/monagent/temp"
     register: agent_path_check

   - name: "Hosts with no Site24x7 Agent Directory"
     debug:
      msg: "Agent Directory not found"
     when: not agent_path_check.stat.exists

   - name: "httpd Status Check"
     service:
        name: httpd
        state: started
     ignore_errors: yes
     when: "ansible_facts['os_family'] == 'RedHat'"

   - name: "apache Status Check"
     service:
        name: apache2
        state: started
     ignore_errors: yes
     when: "ansible_facts['os_family'] == 'Debian'"

   - name: "Site24x7 Temp Plugins Directory Creation."
     file:
      path: "/opt/site24x7/monagent/temp/plugins/apache"
      state: directory
     when: agent_path_check.stat.exists

   - name: "Site24x7 Plugin Directory Check"
     stat:
      path: "/opt/site24x7/monagent/temp/plugins/apache"
     register: plugin_path_check

   - name: "Download the Site24x7 apache Plugin Files."
     get_url:
        url: "{{ item }}"
        dest: "/opt/site24x7/monagent/temp/plugins/apache"
        mode: 0744
     loop: ["https://raw.githubusercontent.com/site24x7/plugins/master/apache/apache.py","https://raw.githubusercontent.com/site24x7/plugins/master/apache/apache.cfg"]
     when: plugin_path_check.stat.exists
    

  # Site24x7 apache Plugin Config File Setup

   - name: "Site24x7 apache Config File Check."
     stat:
      path: "/opt/site24x7/monagent/temp/plugins/apache/apache.cfg"
     register: apache_file_check

   - name: "Site24x7 apache configuration."
     lineinfile: 
       path: "/opt/site24x7/monagent/temp/plugins/apache/apache.cfg"
       regexp: "{{ item.regex }}"
       line: "{{ item.line }}"
     loop:
       - { regex: 'url =', line: 'url ="{{apache_url}}"' }
       - { regex: 'username =', line: 'username ="{{apache_username}}"' }
       - { regex: 'password =', line: 'password ="{{apache_password}}"' }
       - { regex: 'apache_access_logs_enabled =', line: 'apache_access_logs_enabled ="{{apache_access_logs_enabled}}"' }
       - { regex: 'apache_access_logs_file_path =', line: 'apache_access_logs_file_path ="{{apache_access_logs_file_path}}"' }

     when: apache_file_check.stat.exists

  # Site24x7 apache Python File Setup

   - name: "Site24x7 apache Python File Check."
     stat:
      path: "/opt/site24x7/monagent/temp/plugins/apache/apache.py"
     register: apache_python_file_check

   - name: "Extracting Python3 Default Path."
     command: which python3
     register: python3_path

   - set_fact:
      actual_path: "{{ '#!'+python3_path.stdout }}"

   - name: "Setting the Default Python Path for the Site24x7 apache Plugin"
     lineinfile:
       path: "/opt/site24x7/monagent/temp/plugins/apache/apache.py"
       regexp: "#!"
       line: "{{actual_path}}"
     when: apache_python_file_check.stat.exists

   - name: "Checking the Site24x7 apache Plugin Output"
     shell: "python3 /opt/site24x7/monagent/temp/plugins/apache/apache.py --url=\"{{apache_url}}\" --username=\"{{apache_username}}\" --password=\"{{apache_password}}\" --apache_access_logs_enabled=\"{{apache_access_logs_enabled}}\" --apache_access_logs_file_path=\"{{apache_access_logs_file_path}}\""
     register: apache_python_output
     when: apache_python_file_check.stat.exists

   - name: "Site24x7 apache plugins with Error !"
     debug:
      msg: "Site24x7 apache Plugin OUTPUT error ! \n {{ apache_python_output.stdout }}"
     when: "'\"status\": 0' in apache_python_output.stdout and apache_python_file_check.stat.exists"

   - name: "Moving the Site24x7 apache Folder to the Plugins Directory"
     command: "mv  /opt/site24x7/monagent/temp/plugins/apache /opt/site24x7/monagent/plugins"
     ignore_errors: true
     when: "plugin_path_check.stat.exists and '\"status\": 0' not in apache_python_output.stdout"
